<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IzlazNS — Događaji u lokalima Novog Sada</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="loader" class="loader" role="status" aria-label="Učitavanje">
  <div class="bubble">
    <svg class="squiggle-svg" viewBox="0 0 200 60" aria-hidden="true">
      <path id="squiggle" class="squiggle"
        d="M10,30 C 30,5 50,55 70,30 C 90,5 110,55 130,30 C 150,5 170,55 190,30" />
    </svg>
  </div>
  <div class="loader-label">učitavanje zabave…</div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <div class="brand">
        <img id="logo-img" src="/assets/logo/logo.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';" />
        <div id="logo-fallback" class="logo-fallback">Izlaz<span>NS</span></div>
      </div>
      <nav class="main-nav" id="main-nav"></nav>
    </div>
    <nav class="topbar-actions" id="topbar-actions"></nav>
  </div>
</header>

<main id="app"></main>

<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
